<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cờ Vua Đối Kháng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
:root{--bg:#F7F7F7;--card:#fff;--ink:#4B4B4B;--line:#E5E5E5;--gd:#58A700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131F24;--card:#202F36;--ink:#E5E5E5;--line:#37464F;--gd:#7ED321;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131F24;--card:#202F36;--ink:#E5E5E5;--line:#37464F;--gd:#7ED321;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:800;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
body{position:fixed;inset:0;width:100%}
#app{height:100%;display:flex;align-items:center;justify-content:center}
#app.port{flex-direction:column}#app.land{flex-direction:row}
.panel{position:relative;flex:none}
.pin{position:absolute;left:50%;top:50%;box-sizing:border-box;padding:8px 12px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:26px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .3s,border-color .3s}
.pin.on{border-color:#58CC02;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 22px 6px rgba(88,204,2,.55)}0%,100%{box-shadow:0 0 8px 2px rgba(88,204,2,.25)}}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.nm{font-size:14px;white-space:nowrap}
.ck{background:#FF4B4B;color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;display:none}
.ck.on{display:inline-block}

/* Khay trưng bày quân đã ăn */
.tray{display:flex;height:46px;align-items:center;padding:0 10px;background:#A9BDB0;border-radius:23px;box-shadow:inset 0 3px 7px rgba(0,0,0,.25)}
.tray i{width:40px;height:40px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.tray i.n{animation:drop .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{0%{transform:translateY(-30px) scale(1.3)}60%{transform:translateY(0) scale(1.1,.85)}100%{transform:none}}
svg{width:100%;height:100%;display:block}

.btn{--c:#58CC02;--d:#58A700;border:0;border-bottom:4px solid var(--d);background:var(--c);color:#fff;font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.g{--c:#58CC02;--d:#58A700}.btn.b{--c:#1CB0F6;--d:#1899D6}.btn.o{--c:#FF9600;--d:#CC7900}.btn.r{--c:#FF4B4B;--d:#EA2B2B}
.btn.rot{padding:7px 11px;font-size:17px;line-height:1}
.btn.big{width:100%;font-size:17px;padding:13px;border-radius:20px;border-bottom-width:5px}

/* Bàn cờ nằm phẳng */
#bw{position:relative;flex:none}
#board{position:absolute;inset:0;display:grid;grid:repeat(8,1fr)/repeat(8,1fr);border-radius:20px;overflow:hidden;box-shadow:0 0 0 5px #3E8F02,0 0 0 9px var(--card),0 8px 30px rgba(0,0,0,.32)}
#tilt{position:absolute;inset:0}
#pl,#hl,#fx{position:absolute;inset:0;pointer-events:none}
.sq{background-color:#EBF7E3;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.07)}
.sq.d{background-color:#58CC02}
.sq.last{background-image:linear-gradient(rgba(255,214,0,.4),rgba(255,214,0,.4))}
.sq.sel{background-image:linear-gradient(rgba(255,214,0,.7),rgba(255,214,0,.7))}
.sq.chk{background-image:radial-gradient(circle,rgba(255,75,75,.95),rgba(255,75,75,0) 72%);animation:ckp .8s ease-in-out infinite}
@keyframes ckp{50%{box-shadow:inset 0 0 0 5px #FF4B4B,inset 0 0 18px 4px rgba(255,75,75,.9)}}
.warn{position:fixed;left:50%;top:50%;z-index:15;pointer-events:none;padding:10px 24px;border-radius:99px;background:#FF4B4B;color:#fff;font-size:26px;white-space:nowrap;border-bottom:6px solid #EA2B2B;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* Quân cờ: thân nổi lên trên cái bóng dưới sàn */
.pc,.h{position:absolute;left:0;top:0;width:12.5%;height:12.5%}
.pc{transition:transform .34s cubic-bezier(.3,.8,.3,1)}
.sh{position:absolute;left:18%;right:18%;bottom:8%;height:13%;border-radius:50%;background:rgba(0,0,0,.32);filter:blur(2px);transition:transform .2s,opacity .2s}
.pi{position:relative;width:100%;height:100%;padding:5%;box-sizing:border-box;transform-origin:50% 88%;transition:transform .2s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.22))}
.pc.sel{z-index:5}
.pc.sel .pi{transform:translateY(-12%) scale(1.14);animation:hover 1.1s ease-in-out infinite}
.pc.sel .sh{transform:scale(.78);opacity:.55}
@keyframes hover{50%{transform:translateY(-17%) scale(1.17)}}
.pc.tg .pi,.pc.kc .pi{animation:wob .7s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* Ô đi được: cả ô vuông nổi lên */
.tile{--d:#1899D6;position:absolute;inset:3%;border-radius:10px;background:linear-gradient(150deg,rgba(150,222,255,.95),rgba(28,176,246,.88));box-shadow:0 5px 0 var(--d),0 9px 12px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.75),inset 0 0 0 3px rgba(255,255,255,.28);animation:pop .4s cubic-bezier(.3,1.7,.5,1) backwards,float 1.3s ease-in-out .4s infinite}
.tile.cap{--d:#EA2B2B;background:linear-gradient(150deg,rgba(255,170,170,.95),rgba(255,75,75,.88))}
@keyframes pop{from{transform:translateY(10px) scale(.55);opacity:0}}
@keyframes float{50%{transform:translateY(-3px) scale(1.035);box-shadow:0 9px 0 var(--d),0 16px 16px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.75),inset 0 0 0 3px rgba(255,255,255,.28)}}

/* Hiệu ứng chạm sàn */
.rg{position:absolute;inset:8%;border-radius:50%;border:4px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.8)}
.pt{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:3px}
.fl{position:fixed;z-index:30;pointer-events:none}

#md{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:20}
#md.show{display:flex}
.mc{background:var(--card);border:2px solid var(--line);border-bottom-width:6px;border-radius:30px;padding:20px;width:min(300px,76vmin);box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.mc h2{margin:0;font-size:24px;color:var(--gd)}.mc p{margin:0;font-size:20px}
.stage{perspective:600px;height:160px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.coin{position:relative;width:104px;height:104px;transform-style:preserve-3d}
.f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;padding:16px;box-sizing:border-box;border:6px solid #FFC800;background:#fff}
.f.k{transform:rotateY(180deg);background:#3d4a52}
.pr{display:flex;gap:8px;width:100%}.pr button{flex:1;height:64px;padding:6px;border-radius:20px;background:#EBF7E3;border:0;border-bottom:4px solid #cfe5c3;cursor:pointer}
#res{display:flex;flex-direction:column;gap:10px;width:100%}
.tcg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.chip{border:0;border-bottom:4px solid #cfe5c3;background:#EBF7E3;color:#4B4B4B;border-radius:16px;padding:8px 2px;font:inherit;font-size:16px;line-height:1.15;cursor:pointer;touch-action:manipulation}
.chip small{display:block;font-size:10px;opacity:.7}
.chip.on{background:#58CC02;border-color:#58A700;color:#fff}
.clk{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;min-width:74px;text-align:center;padding:2px 10px;border-radius:14px;background:rgba(127,127,127,.18)}
.clk.on{background:#58CC02;color:#fff}
.clk.low{background:#FF4B4B;color:#fff}
.clk.low.on{animation:lowp .6s ease-in-out infinite}
@keyframes lowp{50%{transform:scale(1.08)}}
.edge{position:fixed;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s}
.edge.on{opacity:1;transition:opacity 1.8s ease-out}
.edge .gr{position:absolute;inset:0}
.edge.on .gr{animation:egp 2.6s ease-in-out infinite}
@keyframes egp{50%{opacity:.78}}
.edge.t{left:0;right:0;top:0;height:46vh}.edge.t .gr{background:linear-gradient(180deg,rgba(34,211,238,.95),rgba(103,232,249,.55) 40%,rgba(125,211,252,0) 100%)}
.edge.b{left:0;right:0;bottom:0;height:46vh}.edge.b .gr{background:linear-gradient(0deg,rgba(34,211,238,.95),rgba(103,232,249,.55) 40%,rgba(125,211,252,0) 100%)}
.edge.l{top:0;bottom:0;left:0;width:46vw}.edge.l .gr{background:linear-gradient(90deg,rgba(34,211,238,.95),rgba(103,232,249,.55) 40%,rgba(125,211,252,0) 100%)}
.edge.r{top:0;bottom:0;right:0;width:46vw}.edge.r .gr{background:linear-gradient(270deg,rgba(34,211,238,.95),rgba(103,232,249,.55) 40%,rgba(125,211,252,0) 100%)}
.st{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);opacity:0;will-change:transform,opacity;background:radial-gradient(circle,#fff,#a5f3fc 55%,#22d3ee);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.edge.t .st{left:var(--p);top:0}.edge.b .st{left:var(--p);bottom:0}.edge.l .st{top:var(--p);left:0}.edge.r .st{top:var(--p);right:0}
.edge.on .st{animation-duration:var(--du);animation-delay:var(--dl);animation-iteration-count:infinite;animation-timing-function:ease-out}
.edge.t.on .st{animation-name:stT}.edge.b.on .st{animation-name:stB}.edge.l.on .st{animation-name:stL}.edge.r.on .st{animation-name:stR}
@keyframes stT{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}14%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--k)*1vh)) scale(1) rotate(180deg)}}
@keyframes stB{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}14%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--k)*-1vh)) scale(1) rotate(180deg)}}
@keyframes stL{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}14%{opacity:1}100%{opacity:0;transform:translate(calc(var(--k)*1vw),var(--dx)) scale(1) rotate(180deg)}}
@keyframes stR{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}14%{opacity:1}100%{opacity:0;transform:translate(calc(var(--k)*-1vw),var(--dx)) scale(1) rotate(180deg)}}
.pin.on .nm{color:var(--gd)}.pin.on .nm::before{content:'▶ '}
</style>
</head>
<body>
<div id="app"></div><div id="md"></div>
<script>
'use strict';
/* ===== Khóa cảm ứng: chặn zoom, cuộn, kéo thanh địa chỉ ===== */
['touchmove','gesturestart','gesturechange','gestureend','contextmenu','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

const $=s=>document.querySelector(s),A=$('#app'),M=$('#md');
const NAME={w:'Trắng',b:'Đen'};

/* ===== Âm thanh (Web Audio, không cần file ngoài) ===== */
let AC;
function snd(f,d=.09,t='sine',v=.15,at=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+at;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*.5,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>snd(f*2,.18,'triangle',.12,i*.1));

/* ===== Quân cờ SVG hoạt hình ===== */
const SH={
P:'<circle cx="50" cy="34" r="14"/><path d="M36 80Q40 52 44 47H56Q60 52 64 80Z"/>',
R:'<path d="M28 16h11v9h7v-9h8v9h7v-9h11v24l-8 8v32H36V48l-8-8z"/>',
N:'<path d="M30 82C28 60 36 50 44 46C36 44 32 38 34 32L50 12L58 20C76 28 74 52 68 64L70 82Z"/>',
B:'<circle cx="50" cy="15" r="7"/><path d="M50 22C70 36 68 56 62 64L68 80H32L38 64C32 56 30 36 50 22Z"/>',
Q:'<path d="M24 34L36 62L38 26L50 56L62 26L64 62L76 34L72 80H28Z"/><circle cx="24" cy="30" r="6"/><circle cx="38" cy="20" r="6"/><circle cx="50" cy="16" r="6"/><circle cx="62" cy="20" r="6"/><circle cx="76" cy="30" r="6"/>',
K:'<path d="M46 4h8v8h8v8h-8v8h-8v-8h-8v-8h8z"/><path d="M50 30C74 30 78 54 66 66L70 80H30L34 66C22 54 26 30 50 30Z"/>'};
const EY={P:64,R:62,B:54,Q:64,K:56};
function svg(t,c){
  const w=c=='w',f=w?'#fff':'#3d4a52',s=w?'#4b4b4b':'#1b2429',e=w?'#4b4b4b':'#fff',y=EY[t];
  const eyes=t=='N'?`<circle cx="52" cy="30" r="3.4" fill="${e}"/>`:
   `<circle cx="42" cy="${y}" r="3.4" fill="${e}"/><circle cx="58" cy="${y}" r="3.4" fill="${e}"/><path d="M45 ${y+7}Q50 ${y+11} 55 ${y+7}" fill="none" stroke="${e}" stroke-width="2.6" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 100 100"><g fill="${f}" stroke="${s}" stroke-width="4" stroke-linejoin="round"><rect x="20" y="80" width="60" height="12" rx="6"/>${SH[t]}</g><ellipse cx="41" cy="46" rx="4" ry="9" fill="#fff" opacity=".3" transform="rotate(20 41 46)"/>${eyes}</svg>`;
}

/* ===== Luật cờ vua ===== */
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],DG=[[1,1],[1,-1],[-1,1],[-1,-1]],ST=[[1,0],[-1,0],[0,1],[0,-1]];
// Ô (r,c) có bị phía "by" tấn công không
function att(b,r,c,by){
  const d=by=='w'?1:-1;
  for(const dc of[-1,1]){const p=inb(r+d,c+dc)&&b[r+d][c+dc];if(p&&p.c==by&&p.t=='P')return 1}
  for(const[a,e]of KN){const p=inb(r+a,c+e)&&b[r+a][c+e];if(p&&p.c==by&&p.t=='N')return 1}
  for(let a=-1;a<2;a++)for(let e=-1;e<2;e++)if(a||e){const p=inb(r+a,c+e)&&b[r+a][c+e];if(p&&p.c==by&&p.t=='K')return 1}
  for(const[dirs,T]of[[DG,'B'],[ST,'R']])for(const[a,e]of dirs){let y=r+a,x=c+e;while(inb(y,x)){const p=b[y][x];if(p){if(p.c==by&&(p.t==T||p.t=='Q'))return 1;break}y+=a;x+=e}}
  return 0;
}
// Nước đi "giả hợp lệ" (chưa kiểm tra vua có bị chiếu)
function pseudo(b,r,c,st){
  const p=b[r][c],o=p.c=='w'?'b':'w',m=[],add=(y,x,f)=>m.push({r,c,y,x,f});
  if(p.t=='P'){
    const d=p.c=='w'?-1:1,s=p.c=='w'?6:1,pr=p.c=='w'?0:7,mv=(y,x,f)=>add(y,x,y==pr?'promo':f);
    if(!b[r+d][c]){mv(r+d,c);if(r==s&&!b[r+2*d][c])add(r+2*d,c,'dbl')}
    for(const dc of[-1,1]){const x=c+dc;if(x<0||x>7)continue;const t=b[r+d][x];
      if(t&&t.c==o)mv(r+d,x);else if(!t&&st.ep&&st.ep[0]==r+d&&st.ep[1]==x)add(r+d,x,'ep')}
  }else if(p.t=='N'||p.t=='K'){
    for(const[a,e]of p.t=='N'?KN:[...DG,...ST]){const y=r+a,x=c+e;if(inb(y,x)&&(!b[y][x]||b[y][x].c==o))add(y,x)}
    const R=p.c=='w'?7:0;
    if(p.t=='K'&&r==R&&c==4){
      const rk=x=>b[R][x]&&b[R][x].t=='R'&&b[R][x].c==p.c;
      if(st.cr[p.c+'K']&&!b[R][5]&&!b[R][6]&&rk(7))add(R,6,'cs');
      if(st.cr[p.c+'Q']&&!b[R][1]&&!b[R][2]&&!b[R][3]&&rk(0))add(R,2,'cl');
    }
  }else{
    for(const[a,e]of p.t=='B'?DG:p.t=='R'?ST:[...DG,...ST]){let y=r+a,x=c+e;while(inb(y,x)){const t=b[y][x];if(t){if(t.c==o)add(y,x);break}add(y,x);y+=a;x+=e}}
  }
  return m;
}
// Áp dụng nước đi lên bản sao bàn cờ (ăn tốt qua đường, nhập thành, phong cấp)
function apply(b,m,pt){
  const n=b.map(x=>x.slice()),p=n[m.r][m.c];n[m.r][m.c]=null;
  if(m.f=='ep')n[m.r][m.x]=null;
  if(m.f=='cs'){n[m.r][5]=n[m.r][7];n[m.r][7]=null}
  if(m.f=='cl'){n[m.r][3]=n[m.r][0];n[m.r][0]=null}
  n[m.y][m.x]=m.f=='promo'?{id:p.id,c:p.c,t:pt||'Q'}:p;
  return n;
}
function findK(b,c){for(let r=0;r<8;r++)for(let x=0;x<8;x++)if(b[r][x]&&b[r][x].t=='K'&&b[r][x].c==c)return[r,x]}
const incheck=(b,c)=>{const k=findK(b,c);return att(b,k[0],k[1],c=='w'?'b':'w')};
function legal(b,r,c,st){
  const p=b[r][c],o=p.c=='w'?'b':'w';
  // Luật riêng: Vua được đi mọi ô kể cả ô bị chiếu; thắng bằng cách ăn Vua đối phương
  return pseudo(b,r,c,st);
}
const hasMove=(b,col,st)=>b.some((row,r)=>row.some((p,c)=>p&&p.c==col&&legal(b,r,c,st).length));
function insuf(b){const l=[];b.forEach((row,r)=>row.forEach((p,c)=>{if(p&&p.t!='K')l.push([p.t,(r+c)%2])}));
  return !l.length||(l.length==1&&(l[0][0]=='B'||l[0][0]=='N'))||l.every(x=>x[0]=='B'&&x[1]==l[0][1])}

/* ===== Dựng giao diện ===== */
let LO=null;try{const s=localStorage.getItem('cvLO');if(s=='land'||s=='port')LO=s}catch(e){}
const LAND=()=>LO?LO=='land':innerWidth>innerHeight;  /* mặc định tự theo màn hình; bấm nút xoay để ép ngang/dọc */
const ROT=()=>LAND()?{w:-90,b:90}:{w:0,b:180};
let G,PE={};
const cells=[];
function mkPanel(c){
  const d=document.createElement('div');d.className='panel';d.id='p'+c;
  d.innerHTML=`<div class="pin"><div class="row"><span class="nm">${NAME[c]}</span><b class="clk">--</b><span class="sp"></span><button class="btn b rot" data-rot="1" title="Xoay ngang/dọc">⟳</button><button class="btn o" data-a="new">Ván mới</button><button class="btn r" data-a="res">Đầu hàng</button></div><div class="tray"></div></div>`;
  return d;
}
const pb=mkPanel('b'),pw=mkPanel('w'),bw=document.createElement('div');bw.id='bw';
bw.innerHTML='<div id="tilt"><div id="board"></div><div id="hl"></div><div id="pl"></div><div id="fx"></div></div>';
A.append(pb,bw,pw);
const EG={};for(const c of'wb'){const e=document.createElement('div');e.className='edge';let h='<div class="gr"></div>';for(let i=0;i<18;i++){const r=Math.random;h+=`<i class="st" style="--p:${(3+i*5.3+r()*4).toFixed(1)}%;--dx:${Math.round((r()-.5)*70)}px;--s:${Math.round(10+r()*10)}px;--dl:${(i*.15+r()*.4).toFixed(2)}s;--du:${(2.4+r()*1.4).toFixed(2)}s;--k:${Math.round(30+r()*26)}"></i>`}e.innerHTML=h;document.body.prepend(e);EG[c]=e}
const BD=$('#board'),PL=$('#pl'),HL=$('#hl'),FX=$('#fx'),TL=$('#tilt');

// Bố cục tự động theo cạnh dài của màn hình
function layout(){
  const W=innerWidth,H=innerHeight,land=LAND(),P=118,pad=10,R=ROT();
  const B=Math.floor(land?Math.min(H-pad*2,W-2*P-pad*4):Math.min(W-pad*2,H-2*P-pad*4));
  A.className=land?'land':'port';
  bw.style.cssText=`width:${B}px;height:${B}px;margin:${pad}px;transform:rotate(${land?-90:0}deg)`;
  for(const c of'wb'){
    const p=c=='w'?pw:pb,L=(land?H:W)-20;
    p.style.width=(land?P:W)+'px';p.style.height=(land?H:P)+'px';
    const pin=p.firstChild;pin.style.width=L+'px';pin.style.height=(P-4)+'px';
    pin.style.transform=`translate(-50%,-50%) rotate(${R[c]}deg)`;
  }
  for(const c of'wb'){const e=EG[c];e.className='edge '+(land?(c=='w'?'r':'l'):(c=='w'?'b':'t'))+(e.classList.contains('on')?' on':'')}

}
addEventListener('resize',layout);addEventListener('orientationchange',layout);

/* ===== Hiển thị trạng thái ===== */
function render(){
  const seen=new Set(),tg=new Set(G.moves.map(m=>{const t=m.f=='ep'?G.b[m.r][m.x]:G.b[m.y][m.x];return t?t.id:-1}));
  G.b.forEach((row,r)=>row.forEach((p,c)=>{
    if(!p)return;seen.add(p.id);let e=PE[p.id];
    if(!e){e=PE[p.id]=document.createElement('div');e.className='pc';e.innerHTML='<i class="sh"></i><div class="pi"></div>';PL.append(e)}
    if(e.dataset.t!=p.t){e.dataset.t=p.t;e.lastChild.innerHTML=svg(p.t,p.c)}
    e.style.transform=`translate(${c*100}%,${r*100}%)`;
    e.classList.toggle('sel',!!G.sel&&G.sel[0]==r&&G.sel[1]==c);
    e.classList.toggle('tg',tg.has(p.id));
    e.classList.toggle('kc',!!G.chk&&G.chk[0]==r&&G.chk[1]==c);
  }));
  for(const id in PE)if(!seen.has(+id)){PE[id].remove();delete PE[id]}
  cells.forEach(q=>{const r=+q.dataset.r,c=+q.dataset.c,is=(a)=>a&&a[0]==r&&a[1]==c;
    q.classList.toggle('sel',is(G.sel));q.classList.toggle('last',!!G.last&&(is(G.last[0])||is(G.last[1])));q.classList.toggle('chk',is(G.chk))});
  HL.innerHTML=G.moves.map(m=>{const d=(Math.abs(m.y-G.sel[0])+Math.abs(m.x-G.sel[1]))*35;
    return `<div class="h" style="transform:translate(${m.x*100}%,${m.y*100}%)"><div class="tile${G.b[m.y][m.x]||m.f=='ep'?' cap':''}" style="animation-delay:${d}ms,${400+d}ms"></div></div>`}).join('');
  for(const c of'wb'){
    const pin=$('#p'+c+' .pin');const on=!!G.on&&!G.over&&G.turn==c;pin.classList.toggle('on',on);EG[c].classList.toggle('on',on);
  }
  showClocks();
}
// Khay trưng bày: tự co khoảng cách để quân không bị cắt; hid = quân đang bay tới (ẩn tới khi chạm khay)

  const T=$('#p'+c+' .tray'),L=G.cap[c],n=L.length,W=T.clientWidth-20,st=n>1?Math.min(30,(W-40)/(n-1)):30;

/* ===== Hộp thoại (xoay về phía người chơi) ===== */
function modal(html,rot){M.innerHTML=`<div class="mc" style="transform:rotate(${rot}deg)">${html}</div>`;M.classList.add('show')}
const hide=()=>M.classList.remove('show');

/* ===== Đồng hồ cờ (kiểu giải đấu: thời gian gốc + cộng thêm sau mỗi nước) ===== */
const TCS=[{l:'1+0',n:'Bullet',b:60,i:0},{l:'1+1',n:'Bullet',b:60,i:1},{l:'3+2',n:'Blitz',b:180,i:2},{l:'5+0',n:'Blitz',b:300,i:0},{l:'10+0',n:'Rapid',b:600,i:0},{l:'15+10',n:'Rapid',b:900,i:10},{l:'90+30',n:'Cổ điển',b:5400,i:30},{l:'∞',n:'Tự do',b:0,i:0}];
let TC=TCS[4],CI;
try{const s=localStorage.getItem('cvTC');if(s!==null)TC=TCS[+s]||TC}catch(e){}
function setClock(){G.t={w:TC.b*1000,b:TC.b*1000};G.inc=TC.i*1000;G.unl=!TC.b}
function fmt(ms){
  const s=Math.max(0,ms)/1000;
  if(s<20)return Math.floor(s)+'.'+Math.floor((s%1)*10);
  const n=Math.ceil(s),h=Math.floor(n/3600),m=Math.floor(n%3600/60),x=String(n%60).padStart(2,'0');
  return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`;
}
function showClocks(){
  for(const c of'wb'){
    const e=$('#p'+c+' .clk');e.textContent=G.unl?'∞':fmt(G.t[c]);
    e.classList.toggle('on',!!G.on&&!G.over&&G.turn==c);
    e.classList.toggle('low',!G.unl&&G.t[c]<20000);
  }
}
function timeout(c){const w=c=='w'?'b':'w';G.t[c]=0;showClocks();finish({w,t:'Hết giờ!',s:NAME[c]+' hết thời gian, '+NAME[w]+' thắng'})}
function tickNow(){
  const now=performance.now(),d=now-G.tick,c=G.turn;G.tick=now;G.t[c]-=d;
  if(G.t[c]<=0){timeout(c);return 1}return 0;
}
function clockLoop(){
  clearInterval(CI);
  CI=setInterval(()=>{if(!G||!G.on||G.over||G.unl)return;if(!tickNow())showClocks()},100);
}
function timeModal(){
  modal(`<h2>Chọn thời gian</h2><div class="tcg">${TCS.map((t,i)=>`<button class="chip${t===TC?' on':''}" data-i="${i}">${t.l}<small>${t.n}</small></button>`).join('')}</div><button class="btn o big" data-rot="1">⟳ Xoay ngang/dọc</button><button class="btn b big" id="tn">Tiếp tục</button>`,0);
  M.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    TC=TCS[+b.dataset.i];try{localStorage.setItem('cvTC',b.dataset.i)}catch(e){}
    M.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));snd(800,.05);
  });
  $('#tn').onclick=()=>{setClock();showClocks();coinModal()};
}

/* ===== Ván mới + tung đồng xu ===== */
function init(){
  let id=0;const o='RNBQKBNR',b=Array.from({length:8},()=>Array(8).fill(null));
  for(let c=0;c<8;c++){b[0][c]={id:id++,c:'b',t:o[c]};b[1][c]={id:id++,c:'b',t:'P'};b[6][c]={id:id++,c:'w',t:'P'};b[7][c]={id:id++,c:'w',t:o[c]}}
  return b;
}
function newGame(){
  PL.innerHTML='';FX.innerHTML='';PE={};

}
function coinModal(){
  modal(`<h2>Ai đi trước?</h2><div class="stage"><div class="coin"><i class="f">${svg('K','w')}</i><i class="f k">${svg('K','b')}</i></div></div><div id="res"><button class="btn b big" id="fl">Tung đồng xu</button></div>`,0);

// Lúc bắt đầu: quân cờ rơi từ trên cao xuống bàn
function intro(){
  let i=0;

    const e=PE[id],o={duration:560,delay:i++*16,easing:'ease-in',fill:'backwards'};
    e.lastChild.animate([{transform:'translateY(-160%) scale(1.7)',opacity:0},{offset:.7,transform:'translateY(0) scale(.92,1.1)',opacity:1},{transform:'none',opacity:1}],o);

/* ===== Chạm để đi ===== */
BD.addEventListener('pointerdown',e=>{
  if(!e.isPrimary)return;const q=e.target.closest('.sq');
  if(!q||!G.on||G.busy||G.over)return;tap(+q.dataset.r,+q.dataset.c);
});
function tap(r,c){
  const p=G.b[r][c],mv=G.moves.find(m=>m.y==r&&m.x==c);
  if(G.sel&&mv)return mv.f=='promo'?askPromo(mv):exec(mv);
  if(p&&p.c==G.turn){
    if(G.sel&&G.sel[0]==r&&G.sel[1]==c){G.sel=null;G.moves=[]}
    else{G.sel=[r,c];G.moves=legal(G.b,r,c,G);snd(900,.05)}
  }else{G.sel=null;G.moves=[]}
  render();
}
function askPromo(mv){
  const t=G.turn;
  modal(`<h2>Phong cấp</h2><div class="pr">${['Q','R','B','N'].map(x=>`<button data-t="${x}">${svg(x,t)}</button>`).join('')}</div>`,ROT()[t]);
  M.querySelectorAll('button').forEach(b=>b.onclick=()=>{hide();exec(mv,b.dataset.t)});
}

    const bar=(css,o,v)=>{const e=document.createElement('i');e.style.cssText=`position:absolute;transform-origin:${o};will-change:transform,opacity;${css}`;L.append(e);an(e,[{transform:v?'scaleY(0)':'scaleX(0)',opacity:1},{offset:.25,transform:'none',opacity:1},{transform:'none',opacity:0}],600,'ease-out',delay+120)};
    bar(`left:0;top:${cy-cs*.08}px;width:${bs}px;height:${cs*.16}px;background:linear-gradient(90deg,transparent,#FF9600 50%,transparent)`,`${cx}px 50%`,0);
    bar(`top:0;left:${cx-cs*.08}px;height:${bs}px;width:${cs*.16}px;background:linear-gradient(180deg,transparent,#FF9600 50%,transparent)`,`50% ${cy}px`,1);
    glow('rgba(255,170,60,.95)',1.5,480,delay+150);puff('rgba(160,168,176,.85)',5);
    ring('#FF9600',2.2,560,6,1,delay+150);ring('#fff',1.5,420,4,1,delay+240);ring('#FF9600',3,700,3,1,delay+330);
    for(let i=0;i<9;i++){const e=mk(`background:${['#9aa5ad','#6f7b83','#c9d1d6'][i%3]};border-radius:20%`,cs*rnd(.1,.2));arc(e,rnd(-1,1)*cs*1.2,cs*rnd(.5,1.1),cs*rnd(.2,.5),rnd(560,800),rnd(-260,260))}
    shake(5,380);
  }else if(t=='Q'){      // Hậu: đèn sân khấu, vầng sáng quay, vương miện nổi lên, sao hồng-vàng
    const sp=document.createElement('i');sp.style.cssText=`position:absolute;inset:0;border-radius:20px;background:radial-gradient(circle at ${cx}px ${cy}px,rgba(0,0,0,0) ${cs*.9}px,rgba(20,0,40,.5) ${cs*2.8}px)`;L.append(sp);
    an(sp,[{opacity:0},{offset:.2,opacity:1},{offset:.75,opacity:1},{opacity:0}],1000,'linear');
    const sb=mk('background:repeating-conic-gradient(rgba(255,215,0,.9) 0 7deg,rgba(255,95,210,0) 7deg 20deg);-webkit-mask-image:radial-gradient(circle,#000 15%,transparent 68%);mask-image:radial-gradient(circle,#000 15%,transparent 68%)',cs*3.4);
    an(sb,[{transform:'scale(.2) rotate(0deg)',opacity:1},{transform:'scale(1) rotate(100deg)',opacity:0}],900);
    const cw=crown(`clip-path:${CR}`,cs*.8,cs*.6);an(cw,[{transform:'translateY(0) scale(.2) rotate(-12deg)',opacity:0},{offset:.3,transform:`translateY(${-cs*.5}px) scale(1.2) rotate(6deg)`,opacity:1},{offset:.7,transform:`translateY(${-cs*.7}px) scale(1) rotate(0deg)`,opacity:1},{transform:`translateY(${-cs*.95}px) scale(1)`,opacity:0}],900);
    glow('rgba(255,120,220,.9)',1.7,700);
    for(let i=0;i<14;i++){const e=star(['#FFD54A','#FF5FD2','#fff'][i%3],cs*rnd(.16,.3)),a=Math.PI*2*i/14+rnd(-.15,.15),d=cs*rnd(1.1,2);an(e,[{transform:'scale(.2)',opacity:1},{offset:.5,opacity:1},{transform:T(Math.cos(a)*d,Math.sin(a)*d,` scale(1) rotate(${rnd(180,360)}deg)`),opacity:0}],rnd(700,1000))}
    ring('#FF5FD2',2.4,700,6);ring('#FFD54A',1.7,520,5,0,delay+120);
  }else{                 // Vua: cột vàng, vương miện vỡ đôi, mưa đồng xu, vòng sáng hoàng gia
    pillar('rgba(255,200,0,0)','rgba(255,200,0,.85)',cs*.9,640);
    glow('rgba(255,240,150,.95)',1.7,560,delay+120);
    const l=crown(`clip-path:polygon(0 100%,0 30%,25% 60%,50% 0,50% 100%)`,cs*.9,cs*.7,),r=crown(`clip-path:polygon(50% 100%,50% 0,75% 60%,100% 30%,100% 100%)`,cs*.9,cs*.7);
    an(l,[{transform:T(0,-cs*.2),opacity:1},{offset:.2,transform:T(0,-cs*.2),opacity:1},{transform:T(-cs*.7,cs*.9,' rotate(-55deg)'),opacity:0}],820,'ease-in',delay+120);
    an(r,[{transform:T(0,-cs*.2),opacity:1},{offset:.2,transform:T(0,-cs*.2),opacity:1},{transform:T(cs*.7,cs*.9,' rotate(55deg)'),opacity:0}],820,'ease-in',delay+120);
    for(let i=0;i<12;i++){const e=mk('border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3A0,#FFC800 55%,#C98B00);border:2px solid #B87800;box-sizing:border-box',cs*rnd(.16,.24));arc(e,rnd(-1,1)*cs*1.4,cs*rnd(1,2),cs*rnd(.3,.8),rnd(800,1100),rnd(360,900))}
    ring('#FFC800',2.4,660,8,0,delay+120);ring('#fff6c2',1.5,440,4,0,delay+220);shake(4,360);
  }
  setTimeout(()=>L.remove(),delay+1900);
}
const thud=()=>TL.animate([{transform:'scale(1)'},{transform:'scale(.987)'},{transform:'scale(1)'}],{duration:300,delay:260,easing:'ease-out'});

// Quân bị ăn bị hất lên, bay vòng cung rồi rơi vào khay trưng bày của người ăn
function capFly(cp,by){
  const el=PE[cp.id];if(!el)return;
  const g=G;delete PE[cp.id];
  const a=el.getBoundingClientRect(),w=a.width;
  g.cap[by].push(cp);trays(cp.id);
  const it=$('#p'+by+' .tray i[data-id="'+cp.id+'"]');if(!it){el.remove();return}
  const tr=it.getBoundingClientRect(),tx=tr.left+tr.width/2,ty=tr.top+tr.height/2,sx=a.left+w/2,sy=a.top+w/2;
  const r0=LAND()?-90:0,r1=ROT()[by],sc=tr.width/w;
  const cl=document.createElement('div');cl.className='fl';cl.innerHTML=svg(cp.t,cp.c);
  cl.style.cssText=`width:${w}px;height:${w}px;left:${sx-w/2}px;top:${sy-w/2}px;visibility:hidden`;
  document.body.append(cl);
  const D=820,t0=performance.now()+170;let go=0;
  function land(){
    cl.remove();if(g!==G)return;
    const n=$('#p'+by+' .tray i[data-id="'+cp.id+'"]');
    if(n){n.style.visibility='';n.classList.add('n');setTimeout(()=>n.classList.remove('n'),600)}
    $('#p'+by+' .tray').animate([{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:260});
    snd(520,.08,'triangle',.12);
  }
  function f(now){
    if(now<t0)return requestAnimationFrame(f);
    if(!go){go=1;el.remove();cl.style.visibility='visible'}
    const k=Math.min(1,(now-t0)/D),s=k*k*(3-2*k),h=Math.sin(Math.PI*k);
    cl.style.transform=`translate(${(tx-sx)*s}px,${(ty-sy)*s-130*h}px) rotate(${r0+(r1-r0)*s+360*s}deg) scale(${(1+(sc-1)*s)*(1+.55*h)})`;
    cl.style.filter=`drop-shadow(0 ${4+34*h}px ${3+10*h}px rgba(0,0,0,${.3-.12*h}))`;
    if(k<1)requestAnimationFrame(f);else land();
  }
  requestAnimationFrame(f);
}

// Biểu ngữ chiếu tướng: mỗi người thấy một dòng xoay đúng chiều về phía mình
function warn(o){
  for(const c of'wb'){
    const w=document.createElement('div');w.className='warn';w.textContent=c==o?'VUA BỊ CHIẾU!':'CHIẾU TƯỚNG!';document.body.append(w);
    const b=`translate(-50%,-50%) rotate(${ROT()[c]}deg) translateY(70px)`;
    w.animate([{transform:b+' scale(.3)',opacity:0},{offset:.2,transform:b+' scale(1.25)',opacity:1},{offset:.35,transform:b+' scale(1)'},{offset:.85,transform:b+' scale(1)',opacity:1},{transform:b+' scale(.9)',opacity:0}],{duration:1500,fill:'both'}).onfinish=()=>w.remove();
  }
}
function exec(m,pt){
  if(!G.unl&&tickNow())return;
  G.busy=1;const g=G,b=G.b,p=b[m.r][m.c],cp=m.f=='ep'?b[m.r][m.x]:b[m.y][m.x],mover=G.turn;
  if(cp)capFly(cp,mover);
  G.b=apply(b,m,pt);
  if(p.t=='K')G.cr[p.c+'K']=G.cr[p.c+'Q']=0;
  for(const[sq,k]of[[[7,0],'wQ'],[[7,7],'wK'],[[0,0],'bQ'],[[0,7],'bK']])
    if((m.r==sq[0]&&m.c==sq[1])||(m.y==sq[0]&&m.x==sq[1]))G.cr[k]=0;
  G.ep=m.f=='dbl'?[(m.r+m.y)/2,m.c]:null;
  G.half=(p.t=='P'||cp)?0:G.half+1;
  G.last=[[m.r,m.c],[m.y,m.x]];G.sel=null;G.moves=[];
  G.turn=mover=='w'?'b':'w';
  if(!G.unl)G.t[mover]+=G.inc;
  const o=G.turn,kd=!!cp&&cp.t=='K',ck=!kd&&incheck(G.b,o),any=kd||hasMove(G.b,o,G),k=key();
  G.chk=ck?findK(G.b,o):null;G.hist[k]=(G.hist[k]||0)+1;
  let end=null;
  if(kd)end={w:mover,t:'Ăn được Vua!',s:NAME[mover]+' thắng ván cờ'};
  else if(!any)end={t:'Hòa cờ',s:'Hết nước đi'};
  else if(insuf(G.b))end={t:'Hòa cờ',s:'Không đủ quân để chiếu hết'};
  else if(G.half>=100)end={t:'Hòa cờ',s:'50 nước không ăn quân, không đi tốt'};
  else if(G.hist[k]>=3)end={t:'Hòa cờ',s:'Lặp lại thế cờ 3 lần'};
  if(cp){snd(300,.14,'triangle',.28);snd(800,.06,'sine',.1,.07)}else snd(620,.09);
  if(ck&&!end){snd(700,.1,'square',.07,.12);snd(500,.16,'square',.07,.22)}
  render();
  hop(G.b[m.y][m.x].id,p.t=='N'?1.7:1);
  if(m.f=='cs')hop(G.b[m.r][5].id,1);
  if(m.f=='cl')hop(G.b[m.r][3].id,1);
  burst(m.y,m.x,false,260,RC[p.t]);
  if(cp){thud();capFx(p.t,m,260)}
  if(m.f=='promo')capFx('Q',m,cp?750:260);
  if(cp&&cp.t=='K')capFx('K',m,550);
  if(ck&&!end)setTimeout(()=>{if(g===G)warn(o)},420);
  setTimeout(()=>{g.busy=0},300);
  if(end)setTimeout(()=>finish(end),cp?1150:800);
}
function finish(e){
  if(!G)return;G.over=1;render();fanfare();
  modal(`<h2>${e.t}</h2><p>${e.s}</p><button class="btn g big" id="nw">Ván mới</button>`,e.w?ROT()[e.w]:0);
  $('#nw').onclick=newGame;
}

document.addEventListener('click',e=>{if(!e.target.closest('[data-rot]'))return;LO=LAND()?'port':'land';try{localStorage.setItem('cvLO',LO)}catch(_){}snd(700,.05);layout()});
/* ===== Nút chức năng (bấm 2 lần để xác nhận) ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!G||G.over)return;
  const c=b.closest('.panel').id[1],a=b.dataset.a;
  if(b.dataset.ask){clearTimeout(+b.dataset.ask);b.textContent=b.dataset.txt;delete b.dataset.ask;
    return a=='new'?newGame():finish({w:c=='w'?'b':'w',t:'Đầu hàng',s:NAME[c]+' đã đầu hàng, '+NAME[c=='w'?'b':'w']+' thắng'})}
  b.dataset.txt=b.textContent;b.textContent='Chắc chưa?';snd(900,.05);
  b.dataset.ask=setTimeout(()=>{b.textContent=b.dataset.txt;delete b.dataset.ask},2200);
});

layout();newGame();
